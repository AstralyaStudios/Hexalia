buildscript {
    configurations.classpath {
        resolutionStrategy.force 'dev.architectury:architectury-transformer:5.2.91'
    }
}

plugins {
    id 'dev.architectury.loom' version '1.7.421' apply false
    id 'architectury-plugin' version '3.4.161'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id 'com.diffplug.spotless' version '6.25.0'
}

architectury {
    minecraft = project.minecraft_version
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder()
        removeUnusedImports()
        googleJavaFormat('1.28.0')
        formatAnnotations()
    }
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
            content {
                includeGroup 'org.parchmentmc.data'
            }
        }
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupByRegex 'software\\.bernie.*'
                includeGroup 'com.eliotlash.mclib'
            }
        }
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com/'
            content {
                includeGroup 'mezz.jei'
                includeGroup 'vazkii.patchouli'
            }
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
            content {
                includeGroup 'me.shedaniel'
                includeGroup 'dev.architectury'
            }
        }
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases/'
            content {
                includeGroup 'dev.emi'
                includeGroup 'dev.emi.trinkets'
                includeGroup 'com.terraformersmc.terraform-api'
            }
        }
        maven {
            name = 'Ladysnake'
            url = 'https://maven.ladysnake.org/releases'
            content { includeGroup 'dev.onyxstudios.cardinal-components-api' }
        }
        maven {
            name = 'Curios'
            url = 'https://maven.theillusivec4.top/'
            content { includeGroup 'top.theillusivec4.curios' }
        }
        maven {
            name = 'WispForest'
            url = 'https://maven.wispforest.io/releases/'
            content { includeGroupByRegex 'io\\.wispforest(\\..*)?' }
        }
        maven { url = 'https://maven.jamieswhiteshirt.com/libs-release' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
        it.options.compilerArgs += ['-Xlint:deprecation']
    }

    tasks.named('runClient', JavaExec).configure {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
        }
    }
}
