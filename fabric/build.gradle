plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:$rootProject.geckolib_fabric_version"
    modImplementation("com.terraformersmc.terraform-api:terraform-wood-api-v1:7.0.1") {
        exclude group: 'com.llamalad7.mixinextras'
    }
    include "com.terraformersmc.terraform-api:terraform-wood-api-v1:7.0.1"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:11.1.136"
    modCompileOnly "mezz.jei:jei-1.20.1-common-api-intermediary:$rootProject.jei_version"
    modCompileOnly "mezz.jei:jei-1.20.1-fabric-api:$rootProject.jei_version"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rootProject.rei_version"
    modCompileOnly "dev.emi:emi-fabric:${rootProject.emi_version}:api"
    modRuntimeOnly "dev.emi:emi-fabric:${rootProject.emi_version}"
    modCompileOnly "dev.emi:trinkets:3.7.1"
    modCompileOnly("io.wispforest:accessories-fabric:$rootProject.accessories_version") {
        transitive = false
    }
    modRuntimeOnly "dev.emi:trinkets:3.7.1"
    modImplementation "vazkii.patchouli:Patchouli:${rootProject.patchouli_version}-FABRIC"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
